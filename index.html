<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>זוויות צמודות וקודקודיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>

/* Layout: a fixed 1280x720 (16:9) stage, scaled as a whole to fit the embed window. Every screen is a two-column board: text and steps on the right, figure on the left. Single light "textbook" look by design. */
:root{
  --page:#eef3f8; --paper:#ffffff; --ink:#1b2129; --muted:#5a6573; --rule:#d5dde7;
  --arc:#1f5fbf; --fill:#fff0bf; --fill-hot:#7fd0f5; --accent:#1f5fbf; --accent-ink:#ffffff;
  --ok:#1f9254; --ok-bg:#e3f5ea; --bad:#d23434; --bad-bg:#fde8e8;
  --ui:"Rubik","Arial Hebrew",Arial,sans-serif; --math:"Times New Roman",Georgia,serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--page);color:var(--ink)}
body{font-family:var(--ui);direction:rtl}
*,*::before,*::after{box-sizing:border-box}
#stage{position:absolute;top:50%;left:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:center center;display:flex;flex-direction:column;padding:18px 34px 20px;font-size:19px;line-height:1.5;background:var(--page);overflow:hidden}
header.top{display:flex;align-items:center;justify-content:space-between;gap:24px;height:40px;margin-bottom:14px;flex:none}
header.top h1{font-size:25px;margin:0;font-weight:700}
.prog{width:460px;display:flex;align-items:center;gap:14px}
.prog-track{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog-seg{height:11px;border-radius:6px;background:var(--rule);transition:background .4s}
.prog-seg.on{background:var(--accent)}
.prog-label{font-size:15px;color:var(--muted);white-space:nowrap}
#app{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:22px 32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px}
.col{min-width:0;min-height:0;display:flex;flex-direction:column}
.figcol{align-items:center;justify-content:center}
.kicker{font-size:14px;letter-spacing:.04em;color:var(--muted);font-weight:500;margin:0 0 2px}
h2{font-size:29px;margin:0 0 6px;line-height:1.25}
.lead{margin:0 0 12px;font-size:18px}
button{font-family:inherit;font-size:18px;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:9px 24px;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--rule);color:var(--muted);cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
:focus-visible{outline:3px solid #8fb4ee;outline-offset:2px}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tries{font-size:15px;color:var(--muted)}
.fb{margin-top:8px;padding:8px 14px;border-radius:10px;font-size:17px;line-height:1.45;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#145c36;border-inline-start:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);color:#8a1f1f;border-inline-start:4px solid var(--bad)}
.fb.info{background:#eef3fb;color:var(--ink);border-inline-start:4px solid var(--accent)}
.fb.reveal{background:#f3f6fa;color:var(--ink);border-inline-start:4px solid var(--muted)}
.fb p{margin:0}.fb p+p{margin-top:6px}
.next{margin-top:auto;padding-top:10px;display:flex}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:var(--math)}
[hidden]{display:none!important}

/* figures */
svg.fig{width:100%;height:auto;display:block}
.ln{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.ang-fill{fill:var(--fill)}
.ang-arc{fill:none;stroke:var(--arc);stroke-width:2}
.lbl{font-family:var(--math);font-style:italic;fill:var(--arc);font-size:19px}
.lbl.val{font-style:normal;font-weight:700;fill:var(--ink);font-size:16px}
.lbl.expr{font-style:normal;font-weight:700;fill:var(--ink);font-size:17px}
.vtx{fill:var(--ink)}
.ang.okm .ang-fill{fill:#bfe8cf}.ang.okm .ang-arc{stroke:var(--ok)}
.ang.badm .ang-fill{fill:#f7c4c4}.ang.badm .ang-arc{stroke:var(--bad)}
.ang.ghost{opacity:0}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(31,95,191,.07)}
.pulse .ang-fill{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{fill:var(--fill-hot)}}
.figwrap{position:relative;width:100%;max-width:520px}
.photo-wrap{width:388px;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--rule)}
.photo .ang-fill{opacity:.85}
.photo .ang-arc{stroke-width:5}
.photo .ang.okm .ang-arc,.photo .ang.badm .ang-arc{stroke-width:5}
.ln-halo{stroke:#fff;stroke-width:10;stroke-linecap:round;opacity:.9}
.ln-photo{stroke:var(--ink);stroke-width:4.5;stroke-linecap:round}
.vtx-photo{fill:var(--ink);stroke:#fff;stroke-width:2.5}
.plbl{font-family:var(--math);font-style:italic;fill:var(--arc);font-size:50px;stroke:#fff;stroke-width:8px;paint-order:stroke}
.plbl.val{font-style:normal;font-weight:700;fill:var(--ink);font-size:38px}
.photo .hit:hover{fill:rgba(31,95,191,.10)}

/* intro */
.screen.intro{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr)}
.intro-img{width:100%;border-radius:10px;border:1px solid var(--rule);cursor:zoom-in;display:block}
.img-hint{font-size:14px;color:var(--muted);margin-top:6px;text-align:center}
.tip{background:#f6f8fb;border-radius:10px;padding:10px 14px;margin:4px 0 0;font-size:18px}

/* Q1 */
.counter{margin:0 0 6px;font-size:15px;color:var(--muted);font-weight:500}
.stage{display:grid;place-items:center;padding:10px;border:1.5px dashed var(--rule);border-radius:12px;background:#fafcfe}
.stage .card{width:270px;padding:6px;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.bins{display:grid;grid-template-rows:1fr 1fr;gap:14px;width:100%;height:100%}
.bin{border:2px solid var(--rule);border-radius:12px;padding:6px 8px 8px;background:#fff;cursor:pointer;display:flex;flex-direction:column;min-height:0;transition:border-color .2s,background .2s}
.bin.over{border-color:var(--accent);background:#f2f6fd}
.bin h3{margin:0 4px 6px;font-size:19px}
.bin .list{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.card{background:#fff;border:2px solid var(--rule);border-radius:10px;padding:3px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,191,.2)}
.card.dragging{position:absolute;z-index:60;cursor:grabbing;box-shadow:0 10px 24px rgba(20,30,50,.25);pointer-events:none}
.card.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.card.bad{border-color:var(--bad);background:var(--bad-bg)}
.card .cap{display:none;font-size:12px;text-align:center;color:var(--muted);line-height:1.25;padding:2px}
.card.revealed .cap{display:block}
.zoom{position:absolute;top:6px;left:6px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rule);background:#fff;color:var(--accent);display:grid;place-items:center;padding:0}
.zoom:hover{border-color:var(--accent)}
.bin .zoom{width:24px;height:24px;top:3px;left:3px}
.bin .zoom svg{width:14px;height:14px}

/* steps */
.step{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
.step h3{font-size:19px;margin:0 0 8px;font-weight:500}
.step.done h3{color:var(--muted)}
.step-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.step-head h3{margin:0}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:#fff;border:2px solid var(--rule);border-radius:10px;padding:6px 16px;font-weight:500;color:var(--ink);min-width:76px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.numin{width:100px;font-family:var(--ui);font-size:19px;padding:6px 10px;border:2px solid var(--rule);border-radius:9px;text-align:center;direction:ltr;background:#fff;color:var(--ink)}
.numin:focus{border-color:var(--accent);outline:none}
.numin.ok{border-color:var(--ok);background:var(--ok-bg)}
.numin.bad{border-color:var(--bad);background:var(--bad-bg)}
.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ov{position:absolute;transform:translate(-50%,-50%);width:84px;padding:4px 6px;font-size:18px}

/* tools */
.tools{display:flex;gap:8px}
.tools.vert{flex-direction:column}
.tool{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:5px 12px;font-weight:500;font-size:16px;color:var(--ink);white-space:nowrap}
.tool svg{color:var(--accent);flex:none}
.tool:hover{border-color:var(--accent)}
.tool.on{border-color:var(--accent);background:#eaf3fd}
.figrow{display:flex;gap:16px;align-items:flex-start;justify-content:center;width:100%}
.figrow .figwrap{flex:1 1 auto;min-width:0}

/* calculator (draggable, lives on the stage) */
.calc{position:absolute;width:240px;background:#fff;border:1px solid var(--rule);border-radius:14px;box-shadow:0 14px 34px rgba(20,30,50,.25);padding:0 10px 10px;z-index:90;direction:ltr}
.calc .bar{display:flex;justify-content:space-between;align-items:center;direction:rtl;cursor:move;padding:8px 2px 6px;touch-action:none;user-select:none}
.calc .bar span{font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.calc .grip{color:var(--muted);letter-spacing:-2px}
.calc .x{background:none;border:0;font-size:20px;color:var(--muted);padding:0 6px}
.calc input{width:100%;font-size:21px;padding:6px 8px;border:1.5px solid var(--rule);border-radius:8px;text-align:right;margin-bottom:8px;background:#fff;color:var(--ink);font-family:var(--ui)}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{padding:7px 0;border-radius:8px;border:1px solid var(--rule);background:#f7f9fc;font-size:18px;color:var(--ink)}
.calc .keys button.op{background:#eaf1fb}
.calc .keys button.eq{background:var(--accent);color:#fff;border-color:var(--accent)}

/* overlays */
.overlay{position:absolute;inset:0;background:rgba(20,28,40,.45);z-index:100;display:grid;place-items:center;padding:24px}
.panel{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(10,20,40,.3);padding:12px 18px 16px;max-height:100%;overflow:hidden}
.panel-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-weight:500}
.panel .x{background:none;border:0;font-size:22px;color:var(--muted);padding:2px 8px}
.zoom-panel{width:760px}
.zoom-panel.wide{width:1100px}
.zoom-panel img{width:100%;display:block;border-radius:8px}
.zoom-cap{margin:8px 0 0;text-align:center;color:var(--muted)}
.intro-panel{width:460px}
.intro-panel h3{margin:0 0 4px;font-size:22px}
.intro-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule)}
.intro-item .ic{width:44px;height:44px;border-radius:10px;background:#eaf3fd;color:var(--accent);display:grid;place-items:center;flex:none}
.intro-item .ic svg{width:24px;height:24px}
.muted{color:var(--muted);margin:0 0 6px;font-size:17px}
.small{font-size:14px;margin:6px 0 0}
.board-panel{width:960px}
.board-tools{display:flex;gap:6px;align-items:center}
.paper{width:900px;height:540px;margin:0 auto;border:1px solid #c9d6e6;border-radius:8px;background-color:#fff;background-image:linear-gradient(#d9e4f2 1px,transparent 1px),linear-gradient(90deg,#d9e4f2 1px,transparent 1px);background-size:30px 30px;overflow:hidden}
.board-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

/* end */
.screen.end{grid-template-columns:1fr;justify-items:center;align-content:center;text-align:center}
.end-inner{max-width:820px;display:flex;flex-direction:column;align-items:center}
.done-mark{width:70px;height:70px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:36px;margin-bottom:10px}
.end-inner p{margin:0 0 12px;font-size:20px}
/* ===== Escape-room shell ===== */
:root{--room:#0f1a2e;--room2:#16264a;--room-line:rgba(150,190,255,.07);--glow:#7fb2ff;--gold:#f2b544;--gold-deep:#d99a22;--gold-soft:#fff3d6;--on-room:#e8eefb;--on-room-muted:#9fb0cf}
html,body{background:var(--room)}
#stage{background:radial-gradient(1100px 600px at 70% -10%,#22396a 0%,rgba(34,57,106,0) 60%),radial-gradient(900px 600px at 10% 110%,#1b2f58 0%,rgba(27,47,88,0) 60%),linear-gradient(var(--room-line) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--room-line) 1px,transparent 1px) 0 0/40px 40px,var(--room)}
#deco{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none;z-index:0}
header.top,#app{position:relative;z-index:1}
header.top{height:52px;margin-bottom:12px;gap:20px}
header.top h1{color:var(--on-room);font-size:22px;white-space:nowrap}
.prog{width:300px}
.prog-label{color:var(--on-room-muted)}
.prog-seg{background:rgba(255,255,255,.16)}
.prog-seg.on{background:var(--glow)}
.screen{border:0;box-shadow:0 24px 60px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.06)}
.vault{display:flex;align-items:center;gap:12px;padding:5px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(150,190,255,.18)}
.vault-title{color:var(--on-room);font-size:15px;font-weight:500;white-space:nowrap}
.slots{display:flex;gap:8px}
.slot{width:92px;height:40px;border-radius:10px;border:1.5px dashed rgba(159,176,207,.45);display:flex;align-items:center;justify-content:center;gap:4px;color:var(--on-room-muted);background:rgba(10,18,34,.35)}
.slot svg{width:38px;height:29px;flex:none}
.slot b{font-size:17px;direction:ltr;font-family:var(--ui)}
.slot.got{border:1.5px solid var(--gold);background:rgba(242,181,68,.14);color:var(--gold)}
.slot.pop{animation:slotpop .7s ease-out}
@keyframes slotpop{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(242,181,68,.8)}40%{transform:scale(1.15)}100%{transform:scale(1);box-shadow:0 0 0 14px rgba(242,181,68,0)}}
.vault-count{color:var(--on-room-muted);font-size:14px;white-space:nowrap;min-width:142px}
.fly{position:absolute;z-index:120;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:#1a2a4d;border:2px solid var(--gold);color:var(--gold);transform:translate(-50%,-50%);pointer-events:none}
.fly svg{width:38px;height:29px}.fly b{font-size:18px;direction:ltr}
.toast{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:170;background:#14223f;color:#fff;border:1.5px solid var(--gold);border-radius:14px;padding:10px 22px;font-size:19px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;animation:toastin .3s ease-out}
.toast .key{color:var(--gold)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
/* opening screen */
.screen.escape{background:transparent;box-shadow:none;color:var(--on-room);grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center}
.escape .kicker{color:var(--gold)}
.escape h2{font-size:40px;color:#fff;margin-bottom:14px}
.escape .story p{margin:0 0 10px;font-size:20px;line-height:1.6;color:#d7e1f5}
.escape .story p:last-child{color:#fff;font-weight:500}
.btn.gold{background:var(--gold);color:#1b1404;font-weight:700;font-size:20px;padding:12px 30px;box-shadow:0 8px 24px rgba(242,181,68,.3)}
.btn.gold:hover{filter:brightness(1.06)}
.door-front{width:100%;max-width:400px;margin:0 auto;display:block}
.dial-needle{transform-origin:210px 200px;animation:needle 6s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(40deg)}}
/* final challenge */
.loot{display:flex;gap:12px;margin:6px 0 14px}
.loot .card-a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:12px;background:var(--gold-soft);border:1.5px solid var(--gold)}
.loot .card-a svg{width:70px;height:54px}
.loot .card-a b{font-size:22px;direction:ltr;color:#6b4a07}
.plan-wrap{width:100%;max-width:540px;border-radius:14px;overflow:hidden;border:1px solid var(--rule);background:#f4f6fb}
.wall{fill:#2b3442}
.door-leaf{fill:#b9874f;stroke:#7b5428;stroke-width:1.5}
.door-ghost{stroke:#8a96a8;stroke-width:2.5;stroke-dasharray:7 6}
.open-fill{fill:var(--gold);opacity:.25}
.open-arc{fill:none;stroke:var(--gold-deep);stroke-width:4}
.open-lbl{font-family:var(--ui);font-weight:700;font-size:26px;fill:#6b4a07;stroke:#f4f6fb;stroke-width:6px;paint-order:stroke}
.bolt{fill:#8d98a8;transition:transform .45s ease-in}
.bolt.off{transform:translateX(-22px)}
.padlock .shackle{transition:transform .4s ease-out;transform-box:fill-box;transform-origin:left bottom}
.padlock.open .shackle{transform:translateY(-7px) rotate(-28deg)}
.padlock .body{fill:#5a6577;transition:fill .3s}
.padlock.open .body{fill:var(--ok)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.room-lbl{font-size:16px;fill:#7a869a;font-family:var(--ui)}

.screen.final{grid-template-columns:1fr;justify-items:center;align-content:center}
.final-inner{width:760px;max-width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.final-inner .loot{width:620px}
.final-inner .fb{width:620px;text-align:center}
.final-inner h2{font-size:34px}
.door-row{justify-content:center}
.door-row .numin{width:120px;font-size:24px}
/* finale */
.finale{position:absolute;inset:0;z-index:150;perspective:1700px;overflow:hidden;pointer-events:all}
.portal-light{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 50%,rgba(255,250,235,.95),rgba(255,214,120,.55) 45%,rgba(242,181,68,0) 100%);opacity:0;transition:opacity .9s ease-out}
.finale.open .portal-light{opacity:1}
.finale.gone .portal-light{opacity:0;transition:opacity .7s}
.doors{position:absolute;inset:0;transform-style:preserve-3d}
.leaf{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d;backface-visibility:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
.leaf svg{width:100%;height:100%;display:block}
.leaf.left{left:0;transform-origin:left center;transform:rotateY(88deg)}
.leaf.right{right:0;transform-origin:right center;transform:rotateY(-88deg)}
.finale.in .leaf{transition:transform .7s cubic-bezier(.3,1.25,.5,1);transform:rotateY(0)}
.finale.open .leaf.left{transition:transform 1.5s cubic-bezier(.6,0,.2,1);transform:rotateY(110deg)}
.finale.open .leaf.right{transition:transform 1.5s cubic-bezier(.6,0,.2,1);transform:rotateY(-110deg)}
.hub{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .3s .5s}
.finale.in .hub{opacity:1}
.finale.open .hub{opacity:0;transition:opacity .2s}
.needle{position:absolute;left:-4px;bottom:0;width:8px;height:118px;border-radius:4px;background:#f2b544;transform-origin:50% 100%;transform:rotate(-90deg);transition:transform 1s cubic-bezier(.5,0,.2,1.3)}
.hub.turn .needle{transform:rotate(-20deg)}
.knob{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a8,#f2b544 60%,#a86f12)}
.hub-val{position:absolute;left:-70px;top:44px;width:140px;text-align:center;font-size:40px;font-weight:700;color:#f2b544;direction:ltr;opacity:0;transition:opacity .3s}
.hub.turn .hub-val{opacity:1;transition-delay:.8s}
.hub.unlock .knob{box-shadow:0 0 0 0 rgba(255,230,160,.9);animation:unlock .5s ease-out}
@keyframes unlock{to{box-shadow:0 0 0 40px rgba(255,230,160,0)}}
.finale-banner{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(10,18,34,.85);color:#fff;border:2px solid var(--gold);border-radius:14px;padding:10px 28px;font-size:26px;font-weight:700;opacity:0;transition:opacity .4s .6s}
.finale.in .finale-banner{opacity:1}
.finale-banner.out{opacity:0!important;transition:opacity .3s 0s!important}
.finale.gone .doors{opacity:0;transition:opacity .6s}
.confetti{position:absolute;inset:0;width:1280px;height:720px;z-index:160;pointer-events:none}
.screen.emerge{animation:emerge 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes emerge{0%{transform:scale(.55);opacity:0;filter:brightness(1.6)}35%{opacity:1}100%{transform:none;opacity:1;filter:none}}
.mute{width:36px;height:36px;border-radius:10px;border:1px solid rgba(150,190,255,.3);background:rgba(255,255,255,.06);color:var(--on-room);display:grid;place-items:center;padding:0;flex:none}
.mute:hover{background:rgba(255,255,255,.12)}
.fs-btn{height:36px;border-radius:10px;border:1px solid rgba(150,190,255,.3);background:rgba(255,255,255,.06);color:var(--on-room);padding:0 12px;font-size:15px;font-weight:500;white-space:nowrap;flex:none}
.fs-btn:hover{background:rgba(255,255,255,.12)}
.prog{width:auto;gap:10px}.prog-track{width:150px;flex:none}
.mute[aria-pressed="true"]{color:var(--on-room-muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const W=1280,H=720;
const stage=document.getElementById('stage');
const app=document.getElementById('app');
const segs=[...document.querySelectorAll('.prog-seg')];
const progLabel=document.getElementById('progLabel');
let SCALE=1;
function fit(){SCALE=Math.min(window.innerWidth/W,window.innerHeight/H)||1;stage.style.transform=`translate(-50%,-50%) scale(${SCALE})`;}
window.addEventListener('resize',fit);fit();
function toStage(cx,cy){const r=stage.getBoundingClientRect();return[(cx-r.left)/SCALE,(cy-r.top)/SCALE];}

/* ---------- helpers ---------- */
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}kids.forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}
function s(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function pt(cx,cy,r,deg){const t=deg*Math.PI/180;return[cx+r*Math.cos(t),cy-r*Math.sin(t)];}
function norm(a1,a2){while(a2<=a1)a2+=360;return[a1,a2];}
function sectorD(cx,cy,r,a1,a2){[a1,a2]=norm(a1,a2);const p=pt(cx,cy,r,a1),q=pt(cx,cy,r,a2);return`M${cx},${cy}L${p[0]},${p[1]}A${r},${r} 0 ${a2-a1>180?1:0} 0 ${q[0]},${q[1]}Z`;}
function arcD(cx,cy,r,a1,a2){[a1,a2]=norm(a1,a2);const p=pt(cx,cy,r,a1),q=pt(cx,cy,r,a2);return`M${p[0]},${p[1]}A${r},${r} 0 ${a2-a1>180?1:0} 0 ${q[0]},${q[1]}`;}
function fig(w,h,label){return s('svg',{viewBox:`0 0 ${w} ${h}`,class:'fig',role:'img','aria-label':label||'סרטוט'});}
function fullLine(svg,cx,cy,deg,len){const a=pt(cx,cy,len,deg),b=pt(cx,cy,len,deg+180);s('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'ln'},svg);}
function ray(svg,cx,cy,deg,len){const b=pt(cx,cy,len,deg);s('line',{x1:cx,y1:cy,x2:b[0],y2:b[1],class:'ln'},svg);}
function mark(svg,cx,cy,r,a1,a2,cls){const g=s('g',{class:'ang '+(cls||'')});svg.insertBefore(g,svg.firstChild);s('path',{d:sectorD(cx,cy,r,a1,a2),class:'ang-fill'},g);s('path',{d:arcD(cx,cy,r,a1,a2),class:'ang-arc'},g);return g;}
function label(svg,cx,cy,r,a1,a2,text,cls,force){[a1,a2]=norm(a1,a2);const mid=(a1+a2)/2;const span=a2-a1;const rr=force!=null?force:(span<45?r+15:r*0.62);const p=pt(cx,cy,rr,mid);const t=s('text',{x:p[0],y:p[1],'text-anchor':'middle','dominant-baseline':'central',class:'lbl '+(cls||''),direction:'ltr'},svg);t.textContent=text;return t;}
function vertex(svg,cx,cy){s('circle',{cx,cy,r:3.2,class:'vtx'},svg);}
function num(v){const t=String(v).replace(/[°\s]/g,'').replace(',','.').replace(/−/g,'-');if(t==='')return NaN;return Number(t);}
function eq(a,b){return Math.abs(a-b)<0.01;}
function fbox(){return h('div',{class:'fb',role:'status','aria-live':'polite'});}
function say(box,type,html){box.className='fb show '+type;box.innerHTML=html;}
function triesTxt(used){const left=3-used;return left>0?`נותרו ${left} ניסיונות`:'';}

    h('p',null,'לזוויות צמודות יש קודקוד ושוק משותפים, והשוקיים האחרות יוצרות ישר, לכן סכומן 180°.'),
    h('p',null,'כששני ישרים נחתכים נוצרים שני זוגות של זוויות קודקודיות. בכל זוג, השוקיים של זווית אחת הן המשכים של שוקי האחרת, והזוויות שוות זו לזו.'),
    h('p',null,'עם שני הכללים האלה, זווית אחת מספיקה כדי לדעת את כל הזוויות סביב נקודת החיתוך.'),
    h('div',{class:'actions'},h('button',{type:'button',class:'btn ghost',onclick:restart},'תרגול מההתחלה')));
  sc.append(inner);return sc;
}

function build(){calc.hidden=true;app.innerHTML='';screens.length=0;for(const k in boards)delete boards[k];collected=[false,false,false];renderSlots();[buildEscape,buildIntro,buildQ1,buildQ2,buildQ3,buildFinal,buildEnd].forEach(fn=>{const sc=fn();sc.hidden=true;screens.push(sc);app.append(sc);});}
function restart(){build();show(0);}
build();show(0);
})();
</script>
